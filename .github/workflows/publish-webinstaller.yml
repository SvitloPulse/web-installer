name: Build and Publish Web Installer

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_VERSION: 20.12.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn prod

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn prod

      - name: Publish to svitlopulse.github.io
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config --global user.name "Glebka"
          git config --global user.email "Glebka@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://${ACCESS_TOKEN}:x-oauth-basic@github.com" > $HOME/.git-credentials

          git clone https://github.com/SvitloPulse/svitlopulse.github.io
          cd svitlopulse.github.io
          mkdir -p webinstaller
          cp -r ../dist/* webinstaller
          git add -A
          git commit -m "Update webinstaller" || echo "No changes to commit"
          git push origin master
